[workspace]
members = [
    "phira",
    "phira-main",
    "phira-monitor",
    "prpr",
    "prpr-auto-offset",
    "prpr-avc",
    "prpr-l10n",
    "prpr-pbc",
    "tools/*",
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(closed)'] }

[workspace.package]
version = "0.8.2-beta.4"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
base64 = "0.22.1"
bitflags = "2.11.0"
chrono = "0.4.44"
fluent = "0.17.0"
fluent-syntax = "0.12.0"
futures-util = "0.3.32"
hex = "0.4.3"
http = "1"
image = { version = "0.25.10", default-features = false }
inputbox = "0.1.5"
lru = "0.16.3"
lyon = "1.0.19"

macroquad = { git = "https://github.com/Mivik/prpr-macroquad", rev = "2150130", default-features = false }
miniquad = { git = "https://github.com/Mivik/prpr-miniquad", rev = "138679c" }
nalgebra = "0.34.1"

objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-ui-kit = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
once_cell = "1.21.4"
phira = { path = "phira", default-features = false }
phira-mp-client = { git = "https://github.com/TeamFlos/phira-mp", rev = "cc822df" }
phira-mp-common = { git = "https://github.com/TeamFlos/phira-mp", rev = "cc822df" }
pollster = "0.4.0"
prpr = { path = "prpr", default-features = false }
prpr-auto-offset = { path = "prpr-auto-offset" }
prpr-avc = { path = "prpr-avc" }
prpr-l10n = { path = "prpr-l10n" }
rand = "0.8.5"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false }
rfd = "0.17.2"
sasa = { git = "https://github.com/Mivik/sasa", rev = "e76229b", default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sys-locale = "0.3.2"
tempfile = "3.27.0"
tokio = "1.50.0"
tracing = "0.1.44"
uuid = "1.22.0"
url = "2"
walkdir = "2.5.0"
zip = { version = "8.3.0", default-features = false }

[profile.release]
opt-level = 2
# 保留符号表：iOS 的 .ips 崩溃报告靠**App 二进制自身的符号**来显示函数名，
# 不靠 dSYM（侧载 IPA 没有 dSYM 一起装）。strip = true 时帧只剩地址，
# 2026-11-06 那次 SIGABRT 就是这样，完全定位不到行。
strip = "none"
# 行号表：崩溃帧能直接给出 file:line。体积增加约 2~3 MB，值得。
debug = 1

[profile.dev.package."*"]
opt-level = 2

# 本地 patch：给 iOS 的 draw_in_rect 加 catch_unwind，把 panic 写进沙盒文件。
# 上游版本 panic 穿出 extern "C" 边界直接 abort，崩溃原因完全不可见。
[patch."https://github.com/Mivik/prpr-miniquad"]
miniquad = { path = "vendor/prpr-miniquad" }

# 本地 patch：macroquad 的 GPU 计时查询在「上一次没结束时」直接 assert，
# 而渲染中途 panic 必然让 end_gpu_query 被跳过 —— 于是每帧 panic 一次、
# 画面冻结（实机 1088 条重复日志）。改成容错跳过。见 vendor/prpr-macroquad/src/telemetry.rs。
[patch."https://github.com/Mivik/prpr-macroquad"]
macroquad = { path = "vendor/prpr-macroquad" }
